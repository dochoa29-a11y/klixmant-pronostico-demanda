[theme]
base = "light"
primaryColor = "#962A3B"
backgroundColor = "#FBF7F2"
secondaryBackgroundColor = "#F3EAE1"
textColor = "#2B2422"
linkColor = "#962A3B"
borderColor = "#E8DDD3"
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Playfair Display':https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
blueColor = "#962A3B"
blueBackgroundColor = "#F6E9EB"
blueTextColor = "#5C1424"
greenColor = "#8A6A14"
greenBackgroundColor = "#F7EFD8"
greenTextColor = "#5E470C"
yellowColor = "#B0841A"
yellowBackgroundColor = "#FBF3DC"
yellowTextColor = "#6B4D0B"
redColor = "#B3261E"
redBackgroundColor = "#FBE9E7"
redTextColor = "#8C1D17"

[theme.sidebar]
backgroundColor = "#4A0F1C"
secondaryBackgroundColor = "#5C1424"
textColor = "#F7EFE6"
primaryColor = "#E3CB86"
linkColor = "#E3CB86"
borderColor = "#6E2333"

[client]
toolbarMode = "viewer"
showErrorDetails = true

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
